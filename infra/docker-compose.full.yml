version: '3.8'

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - toten-network
  environment:
    DB_USER: toten
    DB_PASSWORD: toten_dev_password
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: toten_db
    REDIS_HOST: redis
    REDIS_PORT: "6379"

services:
  # ─────────────────────────── INFRASTRUCTURE ───────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: toten-postgres
    <<: *service-defaults
    environment:
      POSTGRES_USER: toten
      POSTGRES_PASSWORD: toten_dev_password
      POSTGRES_DB: toten_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toten"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: toten-redis
    <<: *service-defaults
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: toten-minio
    <<: *service-defaults
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  nginx:
    image: nginx:alpine
    container_name: toten-nginx
    <<: *service-defaults
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - auth-service

  # ─────────────────────────── MICROSERVICES ───────────────────────────

  user-service:
    build: ../services/user-service
    container_name: toten-user-service
    <<: *service-defaults
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
    depends_on:
      postgres:
        condition: service_healthy

  auth-service:
    build: ../services/auth-service
    container_name: toten-auth-service
    <<: *service-defaults
    ports:
      - "3002:3002"
    environment:
      PORT: "3002"
      JWT_SECRET: toten_jwt_secret_change_in_prod
      USER_SERVICE_URL: http://user-service:3001
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started

  membership-service:
    build: ../services/membership-service
    container_name: toten-membership-service
    <<: *service-defaults
    ports:
      - "3003:3003"
    environment:
      PORT: "3003"
    depends_on:
      postgres:
        condition: service_healthy

  booking-service:
    build: ../services/booking-service
    container_name: toten-booking-service
    <<: *service-defaults
    ports:
      - "3004:3004"
    environment:
      PORT: "3004"
    depends_on:
      postgres:
        condition: service_healthy

  match-service:
    build: ../services/match-service
    container_name: toten-match-service
    <<: *service-defaults
    ports:
      - "3005:3005"
    environment:
      PORT: "3005"
    depends_on:
      postgres:
        condition: service_healthy

  ranking-service:
    build: ../services/ranking-service
    container_name: toten-ranking-service
    <<: *service-defaults
    ports:
      - "3006:3006"
    environment:
      PORT: "3006"
    depends_on:
      postgres:
        condition: service_healthy

  tournament-service:
    build: ../services/tournament-service
    container_name: toten-tournament-service
    <<: *service-defaults
    ports:
      - "3007:3007"
    environment:
      PORT: "3007"
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build: ../services/notification-service
    container_name: toten-notification-service
    <<: *service-defaults
    ports:
      - "3008:3008"
    environment:
      PORT: "3008"
    depends_on:
      postgres:
        condition: service_healthy

  fraud-service:
    build: ../services/fraud-service
    container_name: toten-fraud-service
    <<: *service-defaults
    ports:
      - "3009:3009"
    environment:
      PORT: "3009"
    depends_on:
      postgres:
        condition: service_healthy

  sponsor-service:
    build: ../services/sponsor-service
    container_name: toten-sponsor-service
    <<: *service-defaults
    ports:
      - "3010:3010"
    environment:
      PORT: "3010"
    depends_on:
      postgres:
        condition: service_healthy

  finance-service:
    build: ../services/finance-service
    container_name: toten-finance-service
    <<: *service-defaults
    ports:
      - "3011:3011"
    environment:
      PORT: "3011"
    depends_on:
      postgres:
        condition: service_healthy

  control-tower:
    build: ../services/control-tower
    container_name: toten-control-tower
    <<: *service-defaults
    ports:
      - "3012:3012"
    environment:
      PORT: "3012"
      USER_SERVICE_URL: http://user-service:3001
      MATCH_SERVICE_URL: http://match-service:3005
      RANKING_SERVICE_URL: http://ranking-service:3006
      FRAUD_SERVICE_URL: http://fraud-service:3009
      FINANCE_SERVICE_URL: http://finance-service:3011
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  toten-network:
    driver: bridge
