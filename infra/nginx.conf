events {
    worker_connections 2048;
}

http {
    # ─── Upstreams ───
    upstream user_service        { server user-service:3001; }
    upstream auth_service        { server auth-service:3002; }
    upstream membership_service  { server membership-service:3003; }
    upstream booking_service     { server booking-service:3004; }
    upstream match_service       { server match-service:3005; }
    upstream ranking_service     { server ranking-service:3006; }
    upstream tournament_service  { server tournament-service:3007; }
    upstream notification_service { server notification-service:3008; }
    upstream fraud_service       { server fraud-service:3009; }
    upstream sponsor_service     { server sponsor-service:3010; }
    upstream finance_service     { server finance-service:3011; }
    upstream control_tower       { server control-tower:3012; }

    # ─── Rate limiting ───
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

    server {
        listen 80;
        server_name localhost;

        # CORS headers
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

        # Preflight
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Rate limit on all API routes
        limit_req zone=api_limit burst=20 nodelay;

        # ─── Service Routes ───
        location /api/users        { proxy_pass http://user_service;         proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /api/auth         { proxy_pass http://auth_service;         proxy_set_header Host $host; }
        location /api/membership   { proxy_pass http://membership_service;   proxy_set_header Host $host; }
        location /api/booking      { proxy_pass http://booking_service;      proxy_set_header Host $host; }
        location /api/matches      { proxy_pass http://match_service;        proxy_set_header Host $host; }
        location /api/ranking      { proxy_pass http://ranking_service;      proxy_set_header Host $host; }
        location /api/tournaments  { proxy_pass http://tournament_service;   proxy_set_header Host $host; }
        location /api/notifications { proxy_pass http://notification_service; proxy_set_header Host $host; }
        location /api/fraud        { proxy_pass http://fraud_service;        proxy_set_header Host $host; }
        location /api/sponsors     { proxy_pass http://sponsor_service;      proxy_set_header Host $host; }
        location /api/finance      { proxy_pass http://finance_service;      proxy_set_header Host $host; }
        location /api/control-tower { proxy_pass http://control_tower;       proxy_set_header Host $host; }

        # Gateway health
        location /health {
            return 200 '{"status":"ok","gateway":"toten-nginx"}';
            add_header Content-Type application/json;
        }
    }
}
