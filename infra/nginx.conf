events {
    worker_connections 1024;
}

http {
    upstream user_service {
        server user-service:3001;
    }

    upstream auth_service {
        server auth-service:3002;
    }

    upstream membership_service {
        server membership-service:3003;
    }

    upstream booking_service {
        server booking-service:3004;
    }

    upstream match_service {
        server match-service:3005;
    }

    upstream ranking_service {
        server ranking-service:3006;
    }

    server {
        listen 80;
        server_name localhost;

        location /api/users {
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/auth {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
        }

        location /api/membership {
            proxy_pass http://membership_service;
            proxy_set_header Host $host;
        }

        location /api/booking {
            proxy_pass http://booking_service;
            proxy_set_header Host $host;
        }

        location /api/matches {
            proxy_pass http://match_service;
            proxy_set_header Host $host;
        }

        location /api/ranking {
            proxy_pass http://ranking_service;
            proxy_set_header Host $host;
        }

        location /health {
            return 200 "OK";
        }
    }
}
